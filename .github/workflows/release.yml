name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Pack plugin and release metadata
        run: |
          npm pack
          sha256sum dsh-on-phone-*.tgz > dsh-on-phone-plugin.sha256
          npm sbom --sbom-format cyclonedx > dsh-on-phone-npm-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dsh-on-phone-*.tgz
            dsh-on-phone-plugin.sha256
            dsh-on-phone-npm-sbom.cdx.json
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
