name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dsh-compatibility:
    name: Current DSH frontend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: node plugin/scripts/check-dsh-compatibility.mjs dsh --contract-only

  gateway:
    name: Gateway (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Probe how a .cmd fake spawns (TEMPORARY)
        if: runner.os == 'Windows'
        run: node scripts/probe-windows-fake.mjs
      - run: npm run verify
